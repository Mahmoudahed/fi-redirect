<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Intelligence</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0D1019;
            color: #FFFFFF;
            font-family: -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 400px; }
        .logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #22E0B6;
        }
        p {
            font-size: 15px;
            color: #8A8D93;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #22E0B6;
            color: #0D1019;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #1A1F2E;
            border-top-color: #22E0B6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #manual { display: none; margin-top: 20px; }
        #manual code {
            display: block;
            background: #151A25;
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #22E0B6;
            word-break: break-all;
            margin-top: 10px;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚽</div>
        <h1>Football Intelligence</h1>
        <p id="status">جاري فتح التطبيق...</p>
        <div class="spinner" id="spinner"></div>

        <div id="manual">
            <p>لم يتم فتح التطبيق تلقائياً؟</p>
            <a id="openBtn" class="btn" href="#">اضغط هنا للفتح</a>
            <p style="margin-top: 24px; font-size: 12px;">
                أو انسخ الرابط التالي:
            </p>
            <code id="manualLink"></code>
        </div>
    </div>

    <script>
        // ✅ استخرج البارامترات من الرابط
        const params = window.location.search.substring(1);
        const urlParams = new URLSearchParams(window.location.search);

        // ✅ اقرأ نوع الفعل من الرابط
        //    - action=vote → صفحة التصويت
        //    - action=team أو غيابه → صفحة الفريق (افتراضي)
        const action = urlParams.get('action') || 'team';

        // ✅ ابنِ الرابط حسب النوع
        let appLink;
        if (action === 'vote') {
            appLink = 'footballintelligence://vote' + (params ? '?' + params : '');
        } else {
            appLink = 'footballintelligence://team' + (params ? '?' + params : '');
        }

        // ✅ اعرض الرابط يدوياً كحل احتياطي
        document.getElementById('manualLink').textContent = appLink;
        document.getElementById('openBtn').href = appLink;

        // ✅ حاول الفتح التلقائي فوراً
        window.location.href = appLink;

        // ✅ إذا لم يُفتح التطبيق خلال 1.5 ثانية، اعرض الواجهة اليدوية
        setTimeout(() => {
            document.getElementById('status').textContent =
                'تعذّر فتح التطبيق تلقائياً';
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('manual').style.display = 'block';
        }, 1500);
    </script>
</body>
</html>
